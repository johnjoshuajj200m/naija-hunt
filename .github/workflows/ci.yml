name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token. This workflow does not push, publish, deploy, or use secrets.
permissions:
  contents: read

# A newer push to the same pull request supersedes the older run.
# Runs on main are never cancelled, so every commit on main keeps a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, test, build, smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # .nvmrc is "22" and package.json engines require ^22.22.2 on that line.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Production build
        run: npm run build

      # The browser is installed from the Playwright version pinned in package-lock.json,
      # so it always matches the installed package. --with-deps adds the OS libraries.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts its own fresh "npm run build && npm run preview"
      # server and never reuses an existing one, so this tests a new production build.
      - name: Playwright smoke tests (desktop and mobile)
        id: e2e
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
